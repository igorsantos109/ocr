[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-historico-br"
version = "0.4.0"
description = "Fundação local e auditável para OCR e HTR de documentos históricos brasileiros"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Projeto ocr-historico-br"}]
dependencies = [
  "typer>=0.12,<1",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0,<3",
  "Pillow>=10.0",
  "PyMuPDF>=1.24",
  "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.9"]
gui = ["playwright>=1.45"]
ocr = ["pytesseract>=0.3.10", "ocrmypdf>=16.0"]
htr = ["kraken>=5.0"]
paddle = ["paddleocr>=3.7", "paddlepaddle>=3.3", "rapidocr_onnxruntime>=1.2,<1.3"]  # superiores relaxados: sem incompatibilidade conhecida documentada
web = ["gradio>=4.0"]

[project.scripts]
ocrhist = "ocr_historico.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ocr_historico*"]

[tool.setuptools.package-data]
ocr_historico = ["configs/*.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["integration: teste que usa o ambiente instalado", "gui: teste opcional da GUI em navegador headless"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
packages = ["ocr_historico"]
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["numpy.*", "cv2.*", "fitz.*", "PIL.*"]
ignore_errors = true
